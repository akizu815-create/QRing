name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Keep the existing 08:00 JST prewarm; never publish using a future clock.
    - cron: "50 22 * * *"
    # Reconcile all day, including missed articles from yesterday. Best effort,
    # since GitHub may delay or drop scheduled runs; this is not an exact-time SLA.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and redeploy even if the live snapshot matches"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      action: ${{ steps.plan.outputs.action }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      # Read current main inside the deployment lock, not an older queued event.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Respect the real publication clock
        env:
          COLUMN_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/prepare-column-build.py
      - name: Reconcile due articles with the live content
        id: plan
        env:
          COLUMN_FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
        run: python3 scripts/plan-column-publication.py

  build:
    needs: plan
    if: needs.plan.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:columns
      - run: npm run test:scheduled-columns
      - run: python3 -m unittest discover -s tests/publication -v
      - name: Build with a fixed real cutoff and publication snapshot
        env:
          COLUMN_SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: npm run build
      - run: npm run check:column-export
      - run: npm run check:column-navigation
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: [plan, build]
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse to overwrite newer main with a stale build
        uses: actions/github-script@v7
        env:
          PUBLICATION_SOURCE: ${{ needs.plan.outputs.source }}
        with:
          script: |
            const latest = await github.rest.repos.getCommit({...context.repo, ref: 'main'});
            if (latest.data.sha !== process.env.PUBLICATION_SOURCE) {
              core.setFailed('main changed during the build. No stale deployment was made; the next scheduled run will reconcile latest main.');
            }
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the live due articles and exclude future articles
        run: python3 scripts/check-live-columns.py

  publication-status:
    # A verified no-op already has its report; do not start another runner.
    if: always() && github.ref == 'refs/heads/main' && (needs.plan.result != 'success' || needs.plan.outputs.action != 'noop')
    needs: [plan, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record verified no-op or successful publication; fail on errors
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          ACTION: ${{ needs.plan.outputs.action }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python3 - <<'PY'
          import json, os
          state = {k: os.environ[k] for k in ['PLAN_RESULT','ACTION','BUILD_RESULT','DEPLOY_RESULT']}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Column publication\n\n```json\n'+json.dumps(state)+'\n```\n')
          ok = state['PLAN_RESULT'] == 'success' and (
              state['ACTION'] == 'noop' or
              (state['ACTION'] == 'build' and state['BUILD_RESULT'] == 'success' and state['DEPLOY_RESULT'] == 'success'))
          if not ok:
              raise SystemExit('Publication failed. The next schedule retries from latest main; workflow_dispatch can force immediate recovery.')
          PY
